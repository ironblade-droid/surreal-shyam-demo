<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surreal Shyam · Photoreal exterior</title><link rel="icon" href="../favicon.ico">
<style>
html,body{margin:0;height:100%;background:#0d0f12;color:#fff;font-family:Georgia,'Times New Roman',serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;overflow:hidden;background:#0d0f12}
#stage{position:absolute;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#stage.drag{cursor:grabbing}
#stage img,#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage img{object-fit:fill;transition:opacity .25s}
#ov{pointer-events:none}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:14px 16px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-size:19px;line-height:1.15}.brand small{display:block;font:600 10px/1.6 system-ui,sans-serif;letter-spacing:2px;opacity:.8}
.home{background:#c9a24b;color:#111;padding:9px 14px;border-radius:22px;text-decoration:none;font:600 13px system-ui,sans-serif;white-space:nowrap}
.seg{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;background:rgba(0,0,0,.5);border-radius:22px;padding:3px;z-index:5;backdrop-filter:blur(6px)}
.seg[hidden]{display:none}
.seg button{border:0;background:none;color:#fff;font:600 13px system-ui,sans-serif;padding:7px 16px;border-radius:18px;cursor:pointer}
.seg button.on{background:#fff;color:#111}
.arrow{position:fixed;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:30px;line-height:1;cursor:pointer;z-index:5;backdrop-filter:blur(4px)}
#prev{left:12px}#next{right:12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:center;font:12px/1.5 system-ui,sans-serif;z-index:4;pointer-events:none}
.bar .tools{pointer-events:auto;display:flex;justify-content:center;margin-bottom:8px}
#bFill{border:0;background:rgba(0,0,0,.5);color:#fff;font:600 12px system-ui,sans-serif;padding:7px 14px;border-radius:18px;cursor:pointer;backdrop-filter:blur(6px);letter-spacing:.06em;text-transform:uppercase}
#bFill.on{background:#c9a24b;color:#111}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:6px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.on{background:#c9a24b}
#card{position:fixed;z-index:6;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(360px,calc(100% - 28px));background:rgba(18,20,24,.92);border:1px solid rgba(201,162,75,.5);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
#card[hidden]{display:none}
#card .k{font:600 10px system-ui,sans-serif;letter-spacing:2px;color:#c9a24b}
#card h3{margin:4px 0 8px;font-size:20px;font-weight:normal}
#card .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font:13px system-ui,sans-serif;margin-bottom:12px}
#card .g b{display:block;font-size:15px}
#card .g span{opacity:.7;font-size:11px}
#card a.go{display:block;text-align:center;background:#c9a24b;color:#111;text-decoration:none;font:600 14px system-ui,sans-serif;padding:10px;border-radius:10px}
#card .x{position:absolute;top:8px;right:10px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer;opacity:.7}
#tip{position:fixed;z-index:6;pointer-events:none;background:rgba(0,0,0,.75);font:600 12px system-ui,sans-serif;padding:5px 9px;border-radius:8px;white-space:nowrap}
#tip[hidden]{display:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.8;z-index:3}
</style></head><body>
<div id="load">Loading Surreal Shyam…</div>
<div id="wrap"><div id="stage"><img id="img" alt="Surreal Shyam, photoreal exterior render"><canvas id="ov"></canvas></div></div>
<div class="top"><div class="brand">Surreal Shyam<small>PREMIUM 3 BHK · UDAIPUR</small></div><a class="home" href="../">Explore floors in 3D</a></div>
<div class="seg" id="seg" hidden role="group" aria-label="Lighting"><button id="bDusk" class="on" type="button">Dusk</button><button id="bDay" type="button">Day</button></div>
<button class="arrow" id="prev" type="button" aria-label="Rotate left">‹</button><button class="arrow" id="next" type="button" aria-label="Rotate right">›</button>
<div class="bar"><div class="tools"><button id="bFill" type="button" aria-pressed="false">Fill screen</button></div><div class="dots" id="dots"></div><span id="cap"></span></div>
<div id="tip" hidden></div>
<div id="card" hidden role="dialog" aria-live="polite"></div>
<script>
// Facts from the builder's brochure (site/src/data.ts)
const WINGS={1:{name:"1st Wing",sbu:2454,bu:1636,carpet:117.84,balc:9.84},2:{name:"2nd Wing",sbu:2505,bu:1672,carpet:120.35,balc:11.15},
 3:{name:"3rd Wing",sbu:2524.5,bu:1683,carpet:118.58,balc:10.59},4:{name:"4th Wing",sbu:2517,bu:1678,carpet:117.19,balc:13.82}};
const sqft=m=>Math.round(m*10.7639), N=12;
let IDMAP={}, mode="dusk", k=-1;            // k=-1: opening hero shot (brochure angle), 0..11 orbit
const $=id=>document.getElementById(id), stage=$("stage"), img=$("img"), ov=$("ov"), card=$("card"), tip=$("tip");
const masks={}; let mask=null, sel=null, hov=null;
const frameName=()=>k<0?"hero":String(k).padStart(2,"0");
// Fit (contain, default on portrait) vs Fill (cover). Pinch zooms between them.
let cover=false, scale=1, pinch=null;
function box(vw,vh,mode){ // mode 'contain' | 'cover'
  const r=16/9;
  if(mode==="contain"){const w=Math.min(vw,vh*r),h=w/r;return {w,h,l:(vw-w)/2,t:(vh-h)/2}}
  const w=Math.max(vw,vh*r),h=w/r;return {w,h,l:(vw-w)/2,t:(vh-h)/2};
}
function size(){
  const vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
  const a=box(vw,vh,"contain"), b=box(vw,vh,"cover");
  const coverS=b.w/a.w, maxS=coverS*1.35;
  if(cover) scale=Math.max(coverS, scale);
  scale=Math.max(1, Math.min(maxS, scale));
  const w=a.w*scale, h=a.h*scale;
  Object.assign(stage.style,{width:w+"px",height:h+"px",left:(vw-w)/2+"px",top:Math.max(0,(vh-h)/2)+"px"});
  const filled=scale>=coverS-0.02;
  $("bFill").textContent=filled?"Fit image":"Fill screen";
  $("bFill").classList.toggle("on", filled);
  $("bFill").setAttribute("aria-pressed", filled?"true":"false");
}
const res=()=>stage.offsetWidth<1100&&devicePixelRatio<2.5?"1024":"1920";
function src(m,f){return `img/${m}/${f}-${res()}.webp`}
function show(){
  const f=frameName();
  const m=(k<0&&mode==="day")?"dusk":mode;
  img.src=src(m,f); img.alt=`Surreal Shyam exterior, ${k<0?"street corner view":"angle "+(k+1)+" of 12"}, ${m}`;
  $("cap").textContent=(k<0?"Street-corner view":"Angle "+(k+1)+" / "+N)+" · drag or swipe to rotate · pinch or Fill to zoom · tap a floor";
  [...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i===k));
  $("bDusk").classList.toggle("on",mode==="dusk"); $("bDay").classList.toggle("on",mode==="day");
  $("seg").hidden=k<0;          // hero has no Day render; hide the toggle there
  loadMask(f); sel=null; hov=null; card.hidden=true; tip.hidden=true; draw();
  if(k>=0) [k-1,k+1].forEach(j=>{const jj=(j+N)%N;new Image().src=src(mode,String(jj).padStart(2,"0"))});
}
function loadMask(f){
  if(masks[f]){mask=masks[f];draw();return}
  mask=null; const im=new Image(); im.onload=()=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;
    const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0);masks[f]={w:im.width,h:im.height,d:x.getImageData(0,0,im.width,im.height).data};
    if(frameName()===f){mask=masks[f];ov.width=im.width;ov.height=im.height;draw()}};
  im.src=`img/id/${f}.png`;
}
function keyAt(cx,cy){
  if(!mask)return null; const r=stage.getBoundingClientRect();
  const x=Math.floor((cx-r.left)/r.width*mask.w), y=Math.floor((cy-r.top)/r.height*mask.h);
  if(x<0||y<0||x>=mask.w||y>=mask.h)return null; const i=(y*mask.w+x)*4, d=mask.d;
  if(d[i+3]<128)return null; return match(d[i],d[i+1],d[i+2]);
}
function match(r,g,b){let best=null,bd=1e9;for(const h in IDMAP){const R=parseInt(h.slice(1,3),16),G=parseInt(h.slice(3,5),16),B=parseInt(h.slice(5,7),16);
  const dd=(R-r)**2+(G-g)**2+(B-b)**2;if(dd<bd){bd=dd;best=h}}return bd<=48?best:null}
function draw(){
  const x=ov.getContext("2d"); if(!mask){x.clearRect(0,0,ov.width,ov.height);return}
  if(ov.width!==mask.w){ov.width=mask.w;ov.height=mask.h}
  const out=x.createImageData(mask.w,mask.h), o=out.data, d=mask.d, W=mask.w;
  const tgt=[sel,hov].filter(Boolean).map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),h===sel]);
  if(tgt.length){
    const isT=(i,t)=>d[i+3]>127&&Math.abs(d[i]-t[0])<4&&Math.abs(d[i+1]-t[1])<4&&Math.abs(d[i+2]-t[2])<4;
    for(let i=0;i<d.length;i+=4){for(const t of tgt){if(!isT(i,t))continue;
      const edge=!isT(i-4,t)||!isT(i+4,t)||!isT(i-W*4,t)||!isT(i+W*4,t);
      o[i]=edge?255:232;o[i+1]=edge?214:182;o[i+2]=edge?120:80;o[i+3]=edge?255:(t[3]?120:70)}}
  }
  x.putImageData(out,0,0);
}
function info(h){return IDMAP[h]}
function openCard(h){
  const t=info(h); if(!t){card.hidden=true;return}
  if(!t.floor){card.innerHTML=`<button class="x" aria-label="Close">×</button><div class="k">GROUND FLOOR</div><h3>Retail shops &amp; entrance lobby</h3>
    <div class="g"><div><b>Double height</b><span>glass shopfronts</span></div><div><b>G + 7</b><span>floors above</span></div></div><a class="go" href="../">Explore the floors in 3D</a>`;}
  else{const w=WINGS[t.wing];card.innerHTML=`<button class="x" aria-label="Close">×</button><div class="k">FLOOR ${t.floor} · ${w.name.toUpperCase()}</div>
    <h3>Flat ${t.unit} · 3 BHK</h3><div class="g"><div><b>${w.sbu.toLocaleString("en-IN")} sq ft</b><span>Super built-up</span></div>
    <div><b>${w.bu.toLocaleString("en-IN")} sq ft</b><span>Built-up</span></div><div><b>${sqft(w.carpet).toLocaleString("en-IN")} sq ft</b><span>Carpet (${w.carpet} m²)</span></div>
    <div><b>${sqft(w.balc)} sq ft</b><span>Balcony (${w.balc} m²)</span></div></div>
    <a class="go" href="../#floor-${t.floor}/wing-${t.wing}">Open floor plan &amp; details →</a>`;}
  card.hidden=false; card.querySelector(".x").onclick=()=>{sel=null;card.hidden=true;draw()};
}
const label=h=>{const t=info(h);return !t?"":!t.floor?"Ground floor · retail & lobby":`Floor ${t.floor} · ${WINGS[t.wing].name} · Flat ${t.unit}`};
function step(dir){k=k<0?(dir>0?1:N-1):(k+dir+N)%N;show()}
let down=null,moved=0,ptrs=new Map();
function pdist(){const[a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)}
stage.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const a=box(document.documentElement.clientWidth,document.documentElement.clientHeight,"contain");pinch={d:pdist(),s:scale,cover};down=null;return}
  pinch=null;down={x:e.clientX,y:e.clientY,acc:0};moved=0;try{stage.setPointerCapture(e.pointerId)}catch{}});
stage.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId)){ptrs.get(e.pointerId).x=e.clientX;ptrs.get(e.pointerId).y=e.clientY}
  if(pinch&&ptrs.size>=2){const a=box(document.documentElement.clientWidth,document.documentElement.clientHeight,"contain");
    const coverS=box(document.documentElement.clientWidth,document.documentElement.clientHeight,"cover").w/a.w;
    scale=Math.max(1,Math.min(coverS*1.35, pinch.s*pdist()/Math.max(1,pinch.d))); cover=scale>=coverS-0.02; size(); return}
  if(down){const dx=e.clientX-down.x;moved=Math.max(moved,Math.abs(dx),Math.abs(e.clientY-down.y));
    if(moved>8)stage.classList.add("drag");
    if(Math.abs(dx-down.acc)>70){const s=dx-down.acc<0?1:-1;down.acc+=s<0?70:-70;step(s)}return}
  if(e.pointerType!=="mouse")return; const h=keyAt(e.clientX,e.clientY);
  if(h!==hov){hov=h;draw()} if(h){tip.hidden=false;tip.textContent=label(h);tip.style.left=e.clientX+14+"px";tip.style.top=e.clientY+14+"px"}else tip.hidden=true;
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size){stage.classList.remove("drag");const was=down;down=null;
  if(was&&moved<8){const h=keyAt(e.clientX,e.clientY);sel=h;hov=null;tip.hidden=true;draw();if(h)openCard(h);else card.hidden=true}}};
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
stage.addEventListener("pointerleave",()=>{if(!down&&!pinch){hov=null;tip.hidden=true;draw()}});
stage.addEventListener("wheel",e=>{e.preventDefault();
  const a=box(document.documentElement.clientWidth,document.documentElement.clientHeight,"contain");
  const coverS=box(document.documentElement.clientWidth,document.documentElement.clientHeight,"cover").w/a.w;
  scale=Math.max(1,Math.min(coverS*1.35, scale*(e.deltaY<0?1.08:1/1.08))); cover=scale>=coverS-0.02; size();
},{passive:false});
$("bFill").onclick=()=>{
  const vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
  const coverS=box(vw,vh,"cover").w/box(vw,vh,"contain").w;
  if(cover||scale>1.02){cover=false;scale=1}else{cover=true;scale=coverS}
  size();
};
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
$("bDusk").onclick=()=>{mode="dusk";show()};
$("bDay").onclick=()=>{mode="day";show()};   // hidden on the hero, so this never jumps off the corner view
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);if(e.key==="Escape"){sel=null;card.hidden=true;draw()}});
addEventListener("resize",()=>{size()});
img.addEventListener("load",()=>{$("load").style.display="none"});
$("dots").innerHTML=Array.from({length:N},()=>"<i></i>").join("");
window.__mask=()=>mask;window.__idmap=()=>IDMAP;window.__ext={get k(){return k},get mode(){return mode},get scale(){return scale},get cover(){return cover}};
size();
fetch("img/id_map.json").then(r=>r.json()).then(j=>{IDMAP=j.colors;show()});
</script></body></html>
