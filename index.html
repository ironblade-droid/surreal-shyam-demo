<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1a16">
<title>Surreal Shyam · Premium 3 BHK · Udaipur · interactive 3D</title>
<meta name="description" content="Explore Surreal Shyam, Udaipur in 3D: pick a floor and wing, see the floor plan and areas, and walk the 360° tour.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%223%22 y=%223%22 width=%2226%22 height=%2226%22 fill=%22none%22 stroke=%22%23b0894f%22 stroke-width=%223%22/%3E%3Crect x=%2210%22 y=%2210%22 width=%2212%22 height=%2212%22 fill=%22none%22 stroke=%22%23b0894f%22 stroke-width=%223%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="stage" aria-label="Photoreal 3D model of Surreal Shyam. Drag to orbit, pinch to zoom, tap a floor, then a wing."></canvas>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><div><div class="name">Surreal <b>Shyam</b></div><div class="sub">Premium 3 BHK · Udaipur</div></div></div>
  <nav class="tools" aria-label="Project">
    <button id="bPlate" type="button"><span class="full">Floor </span>plan</button>
    <a id="ss-ext-link" href="exterior/"><span class="long">View photoreal exterior</span><span class="short">Exterior</span></a>
    <button id="bMode" type="button" aria-label="Switch to day light">☀ Day</button>
    <button id="bRender" type="button">Elevation</button>
    <button id="bLoc" type="button">Location</button>
  </nav>
</header>
<div id="tag" class="tag" hidden></div>
<aside id="panel" class="panel" aria-live="polite"></aside>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
<div id="loading" class="loading" style="background:#1d1a16 url(exterior/img/dusk/hero-1024.webp) center/cover no-repeat"><span style="background:rgba(20,17,13,.55);padding:10px 18px;border-radius:999px;backdrop-filter:blur(6px)">Loading 3D view…</span></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
