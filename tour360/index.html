<!doctype html>
<html lang="en">
<head>

<title>Surreal Shyam · 1st Wing · 360° tour</title>
<style>
  :root{--gold:#f0c98a;--ink:#2a2116;--glass:rgba(22,19,16,.62);--glass2:rgba(22,19,16,.78);
        --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--tap:44px}

            font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;touch-action:none;
            -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{position:fixed;inset:0;height:100vh;height:100dvh}
  canvas{display:block;touch-action:none;cursor:grab;width:100%;height:100%} canvas:active{cursor:grabbing}
  .hud{position:fixed;left:calc(var(--sl) + 58px);top:calc(var(--st) + 12px);pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.5);z-index:4}
  .hud .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}

        display:grid;place-items:center;border-radius:50%;background:var(--glass);color:#fff;text-decoration:none;font-size:20px;
        backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
  a.home:hover{background:rgba(22,19,16,.8)}
  /* always-visible room filmstrip */

  .tabs-in button span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;line-height:1.2;padding-bottom:2px}

  .tabs-in button.on img{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .tabs-in button.on span{color:var(--gold);font-weight:600}

             backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
  .nav-arrow:hover{background:rgba(22,19,16,.85)}
  #prev{left:calc(var(--sl) + 10px)} #next{right:calc(var(--sr) + 10px)}
  /* mini floor plan */
  .minimap{position:fixed;left:calc(var(--sl) + 10px);bottom:calc(var(--sb) + 154px);z-index:5;width:126px;max-height:min(42vh,260px);
           background:var(--glass2);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
           backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:pan-y;overscroll-behavior:contain}

       background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;z-index:5}
  .bar button{all:unset;cursor:pointer;width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:50%;font-size:17px;color:#eee;flex:0 0 auto}
  .bar button:hover{background:rgba(255,255,255,.12)} .bar button.act{background:var(--gold);color:var(--ink)}

  .bar .sep{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 2px;flex:0 0 auto}

  #gyro[hidden],#fsx[hidden]{display:none}

  .hs:hover .dot{transform:scale(1.12)}

  @keyframes ping{0%{transform:scale(1);opacity:.8}70%{transform:scale(1.85);opacity:0}100%{transform:scale(1.85);opacity:0}}

  #load{position:fixed;inset:0;display:grid;place-items:center;color:#ccc;font-size:14px;z-index:8;background:#111}
  .q{position:fixed;right:calc(var(--sr) + 14px);top:calc(var(--st) + 16px);font-size:10px;opacity:.6;letter-spacing:.1em;text-transform:uppercase;pointer-events:none;z-index:4}
  body.single .tabs,body.single .hs,body.single .q,body.single .minimap,body.single .nav-arrow{display:none}
  body.pfs .hud,body.pfs .tabs,body.pfs .q,body.pfs .minimap,body.pfs .nav-arrow,body.pfs a.home,body.pfs .bar>*:not(#fsx){display:none}
  body.pfs .bar{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;left:auto;right:calc(var(--sr) + 12px);transform:none;top:calc(var(--st) + 12px);bottom:auto}

  @media (max-width:600px){
    .bar .hint,.bar .day,.bar .sep.d{display:none}
    .hs .lab{font-size:10px;padding:4px 8px}
    .tabs-in button{width:76px} .tabs-in button img{width:76px;height:40px}
    .minimap{width:104px;bottom:calc(var(--sb) + 150px);max-height:min(32vh,190px)}

  }
  @media (max-height:520px){
    .hud .k{display:none} .hud{top:calc(var(--st) + 8px)} .hud .t{font-size:18px} .q{display:none}
    .bar{bottom:calc(var(--sb) + 8px)}
    .tabs{bottom:calc(var(--sb) + 54px)}
    .tabs-in{padding:4px 6px;gap:6px}
    .tabs-in button span{display:none}
    .tabs-in button{width:64px} .tabs-in button img{width:64px;height:36px;margin-bottom:0}
    .minimap{width:88px;max-height:min(46vh,170px);bottom:auto;top:calc(var(--st) + 54px)}
  }
  @media (max-height:520px) and (orientation:landscape){
    .bar{left:auto;right:calc(var(--sr) + 10px);transform:none}
    #next{right:calc(var(--sr) + 10px);top:auto;bottom:calc(var(--sb) + 58px);transform:none}
  }
</style>
</head>
<body>
<div id="load">Loading tour…</div>
<a class="home" id="home" href="../" aria-label="Back to the building">←</a>
<div class="hud"><div class="k" id="kicker">360° · Surreal Shyam · 1st Wing</div><div class="t" id="title">Living</div></div>
<nav class="tabs" aria-label="Rooms"><div class="tabs-in" id="tabs"></div></nav>
<button class="nav-arrow" id="prev" type="button" aria-label="Previous room">‹</button>
<button class="nav-arrow" id="next" type="button" aria-label="Next room">›</button>
<div class="minimap" id="minimap" hidden>
  <div class="mm-lab">Floor plan</div>
  <div class="mm-scroll" id="mmScroll">
    <div class="mm-in" id="mmIn">
      <img id="mmImg" alt="Floor plan of the 1st Wing">
      <div class="you" id="mmYou"><div class="cone"></div><div class="dot"></div></div>
    </div>
  </div>
</div>
<div id="hots"></div>
<div class="bar">
  <span class="day">☀ Day</span><span class="sep d"></span>
  <button id="play" title="Auto-rotate" aria-label="Auto-rotate">❚❚</button>
  <button id="zout" title="Zoom out" aria-label="Zoom out">−</button><button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="gyro" title="Look around by moving your phone" aria-label="Gyroscope look-around" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="3" width="8" height="14" rx="2"/><path d="M4 18c2.5 3 13.5 3 16 0M18 16l2 2-3 1"/></svg></button>
  <button id="fs" title="Fullscreen" aria-label="Fullscreen">⛶</button><button id="fsx" title="Exit full view" aria-label="Exit full view" hidden>✕</button>
  <span class="hint" id="hint">Drag to look around</span>
</div>
<div class="q" id="q"></div>
<script type="module">
import * as THREE from "./three.module.min.js";
const q = new URLSearchParams(location.search);
const single = q.get("src");
{ const from = q.get("from"); const hb = document.getElementById("home"); if (hb && from && /^floor-\d+(\/wing-\d+)?$/.test(from)) hb.setAttribute("href", "../#" + from); }

const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
const slow = !!conn && (conn.saveData || /(^|-)(2|3)g$/.test(conn.effectiveType || ""));

let auto = q.get("auto") !== "0" && !q.has("lon") && !matchMedia("(prefers-reduced-motion:reduce)").matches;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const maxTex = renderer.capabilities.maxTextureSize;
const desktop = innerWidth >= 900;

  if (want === "mid" || want === "3k") return "mid";

})();
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, 0.1, 1000);
const geo = new THREE.SphereGeometry(100, 128, 80); geo.scale(-1, 1, 1);

#ifdef USE_MAP

const matA = makeMat(), matB = makeMat();
const meshA = new THREE.Mesh(geo, matA), meshB = new THREE.Mesh(geo.clone(), matB);

scene.add(meshA, meshB);
let frontMat = matA, backMat = matB, frontMesh = meshA, backMesh = meshB;
const loader = new THREE.TextureLoader();
const maxAniso = Math.max(1, renderer.capabilities.getMaxAnisotropy());

  return new THREE.Vector3(Math.sin(phi) * Math.cos(th), Math.cos(phi), Math.sin(phi) * Math.sin(th)); };
let W = 0, H = 0;

}

addEventListener("resize", resize);

window.visualViewport?.addEventListener("resize", resize);

let tour = null, room = null, token = 0, last = performance.now(), idle = 0, vLon = 0, vLat = 0;
const qlabel = t => { $("q").textContent = t; };
const shortOf = r => r.short || (r.label || "").split(" · ")[0];
function ease(t) { return t * t * (3 - 2 * t); }

  const tm = frontMat, ts = frontMesh;
  frontMat = backMat; frontMesh = backMesh;
  backMat = tm; backMesh = ts;
}
let fadeGen = 0;

  const t0 = performance.now();
  await new Promise(res => {
    const step = now => {
      if (gen !== fadeGen || my !== token) return res();

  backMat.opacity = 1; backMat.transparent = false;
  swapFront();
  return true;

let showBusy = false, showQueued = null;
function syncChrome(r, first) {
  $("title").textContent = r.label;
  document.querySelectorAll("#tabs button").forEach(b => {
    const on = b.dataset.id === r.id; b.classList.toggle("on", on);
    if (on) b.scrollIntoView({ block: "nearest", inline: "center", behavior: first ? "auto" : "smooth" });
  });
  document.querySelectorAll(".mm-room").forEach(b => b.classList.toggle("on", b.dataset.id === r.id));

  $("prev").style.opacity = idx <= 0 ? .35 : 1;
  $("next").style.opacity = idx >= tour.rooms.length - 1 ? .35 : 1;

function scrollPlan(r) {

    : r.full;

  loader.loadAsync(src).then(tex => { if (my === token) { setMap(frontMat, prep(tex)); qlabel(qname); if (window.__pano) window.__pano.hd = true; } else tex.dispose(); })

    const b = plan.rooms[r.id]; if (!b) continue;
    const el = document.createElement("button"); el.type = "button"; el.className = "mm-room"; el.dataset.id = r.id;
